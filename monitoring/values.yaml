crds:
  enabled: true
  upgradeJob:
    enabled: true

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - cluster.${DOMAIN}
    paths:
      - /alertmanager

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "nfs-csi"
          resources:
            requests:
              storage: 2Gi

    routePrefix: /alertmanager
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 5
            preference:
              matchExpressions:
                - key: raspberrypi5.preferred
                  operator: In
                  values:
                    - "true"

grafana:
  defaultDashboardsTimezone: Europe/Warsaw
  defaultDashboardsInterval: 30s
  adminUser: admin
  adminPassword: ${GRAFANA_PWD}
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - cluster.${DOMAIN}
    path: /grafana
  env:
    GF_SERVER_ROOT_URL: "https://cluster.${DOMAIN}/grafana/"
    GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  persistence:
    enabled: true
    type: sts
    storageClassName: "nfs-csi"
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
    path: "/metrics"
    # Extra scrape settings.
    interval: ""
    scheme: http
    tlsConfig: {}
    scrapeTimeout: 30s

prometheusOperator:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - cluster.${DOMAIN}
    paths:
      - /prometheus
  prometheusSpec:
    retention: 15d
    routePrefix: /prometheus
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 5
            preference:
              matchExpressions:
                - key: raspberrypi5.preferred
                  operator: In
                  values:
                    - "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "nfs-csi"
          resources:
            requests:
              storage: 5Gi
