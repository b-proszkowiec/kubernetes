apiVersion: v1
kind: Service
metadata:
  name: local-http
  namespace: local-services
spec:
  ports:
    - port: 8123
  clusterIP: None
---
apiVersion: v1
kind: Endpoints
metadata:
  name: local-http
  namespace: local-services
subsets:
  - addresses:
      - ip: 192.168.0.200
    ports:
      - port: 8123
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: local-http
  namespace: local-services
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home-assistant.tomcat.org.pl`)
      kind: Rule
      services:
        - name: local-http
          port: 8123
  tls:
    secretName: wildcard-certificate-secret
