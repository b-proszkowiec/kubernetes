apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingress-route
  namespace: jellyfin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bf.tomcat.net.pl`)
      kind: Rule
      services:
        - name: jellyfin-nas
          port: 8096
  tls:
    secretName: jellyfin-certificate-secret
