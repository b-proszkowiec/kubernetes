apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-ingress-route
  namespace: nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.${DOMAIN}`)
      kind: Rule
      services:
        - name: nextcloud-nas
          port: 8080
  tls:
    secretName: nextcloud-certificate-secret
